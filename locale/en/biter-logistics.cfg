[diagnostic]
biter-logistics-request-full=[Biter Logistics] Request nest __1__ __2__ has no free space for __3__. Clear inventory space or raise the inventory bar limit.
biter-logistics-no-supply=[Biter Logistics] No Supply nest can provide __1__ for request __2__ __3__. Put the item into a Supply nest on the same surface and force.
biter-logistics-supply-out-of-depot-range=[Biter Logistics] Supply exists for __1__, but no Biter Fuel Depot range connects it to request __2__ __3__. Move/build a Fuel Depot so both nests are inside the same range.
biter-logistics-all-carriers-busy=[Biter Logistics] Request __2__ __3__ needs __1__, but all covering Carrier Biters are currently busy. Wait for a delivery to finish or add another Carrier Biter to the Fuel Depot.
biter-logistics-food-shortage=[Biter Logistics] Fuel Depot __1__ __2__ does not have enough valid food for delivering __3__ to __4__ __5__. Add Biter Biomass, fish, or other unlocked food.
biter-logistics-pathfinding-failed=[Biter Logistics] Carrier #__1__ cannot reach target __2__ __3__ __4__. Check terrain, cliffs, water, walls, and blocked paths.
biter-logistics-destination-waiting=[Biter Logistics] Carrier #__1__ is waiting with __2__; request nest __3__ __4__ is full. Clear space so it can unload.
