biter-logistics-carrier-feralized-route_failure=[Biter Logistics] Carrier #__1__ went feral after repeated route failures. __2__
biter-logistics-destination-waiting=[Biter Logistics] Carrier #__1__ is waiting with __2__; request nest __3__ __4__ is full. Clear space so it can unload.
biter-logistics-no-control-combinator=[Biter Logistics] Circuit Request nest __1__ __2__ has no Biter Logistics Control Combinator connected. Connect a dedicated control combinator directly to the nest.
