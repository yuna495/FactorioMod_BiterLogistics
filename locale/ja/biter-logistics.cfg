biter-logistics-food-shortage=[Biter Logistics] 補給巣 __1__ __2__ の食料が不足しており、__3__ を __4__ __5__ へ配送できません。Biter Biomass、魚、または研究済みの食料を補給巣へ入れてください。
biter-logistics-pathfinding-failed=[Biter Logistics] Carrier #__1__ が目標 __2__ __3__ __4__ へ到達できません。地形、崖、水、壁、通路の詰まりを確認してください。
biter-logistics-destination-waiting=[Biter Logistics] Carrier #__1__ が __2__ を持ったまま待機しています。Request巣 __3__ __4__ が満杯です。空きを作ると荷降ろしを再開します。
